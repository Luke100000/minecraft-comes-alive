plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.register('dumpMinecraftAPI') {
    dependsOn configurations.compileClasspath
    doLast {
        def cp = configurations.compileClasspath.files
        def cl = new java.net.URLClassLoader(cp.collect { it.toURI().toURL() } as java.net.URL[], null)
        try {
            def snc = cl.loadClass("net.minecraft.client.renderer.SubmitNodeCollector")
            snc.getMethods().each { println "SNC: " + it }
        } catch(Exception e) { println "SNC Error: " + e}
        try {
            def rt = cl.loadClass("net.minecraft.client.renderer.rendertype.RenderType")
            rt.getMethods().each { println "RT: " + it }
            rt.getDeclaredFields().each { println "RTF: " + it }
        } catch(Exception e) { println "RT Error: " + e}
    }
}
