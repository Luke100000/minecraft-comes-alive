plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xmaxerrs" << "1000"
            }
        }
    }
}

def getAppVersion = { ->
    try {
        def result = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }.standardOutput.asText.get().trim()
        def tag = result
        if (tag.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        return tag
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
} as Object

allprojects {
    version = getAppVersion()
}
