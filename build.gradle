plugins {
    id 'java-library'
    id 'architectury-plugin' version 'e3d53cc'
    id 'dev.architectury.loom' version '1.17.477' apply false
    id "io.github.pacifistmc.forgix" version "1.2.9"
}

def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def yarnMappings = providers.gradleProperty('yarn_mappings').get()
def projectGroupId = providers.gradleProperty('groupId').get()
def projectDisplayName = providers.gradleProperty('displayname').get()
def projectName = name

def mavenUsername = providers.environmentVariable('MAVEN_USERNAME')
def mavenToken = providers.environmentVariable('MAVEN_TOKEN')

architectury {
    minecraft = minecraftVersion
}

def getAppVersion = { ->
    try {
        return providers.exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
        }.standardOutput.asText.get().trim()
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return "dev"
    }
} as Object

def appVersion = getAppVersion()
def mergeJarsTask = tasks.named('mergeJars')

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        runs.configureEach {
            getPreferGradleTask().set(true)
            vmArg "--enable-native-access=ALL-UNNAMED"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraftVersion}"
        mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    }
}

allprojects {
    apply plugin: "maven-publish"
    apply plugin: 'architectury-plugin'

    group = projectGroupId
    description = projectDisplayName
    base.archivesName = projectName
    version = appVersion

    tasks.named('build') {
        finalizedBy mergeJarsTask
    }
    tasks.named('assemble') {
        finalizedBy mergeJarsTask
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.release = 17
            options.deprecation = true
            options.compilerArgs << "-Xmaxerrs" << "1000" << "-Xlint:deprecation" << "-Xlint:unchecked"
        }

        tasks.configureEach { task ->
            if (task instanceof JavaForkOptions) {
                if (task.maxHeapSize == null) {
                    task.maxHeapSize = '4G'
                }
                ['--enable-native-access=ALL-UNNAMED'].each { nativeAccessJvmArg ->
                    if (!task.jvmArgs.contains(nativeAccessJvmArg)) {
                        task.jvmArgs(nativeAccessJvmArg)
                    }
                }
            }
        }
    }

    publishing {
        repositories {
            maven {
                name = "reposiliteRepository"
                url = uri("https://maven.conczin.net/Artifacts")
                credentials {
                    username = mavenUsername.orNull
                    password = mavenToken.orNull
                }
            }
        }
    }
}

forgix {
    group = projectGroupId
    mergedJarName = "${projectName}-${appVersion}-universal.jar"
    outputDir = "build/libs"

    forge { container ->
        container.jarLocation = "build/libs/${projectName}-${appVersion}.jar"
        container.mixin "mca.mixin.json"
        null
    }

    fabric { container ->
        container.jarLocation = "build/libs/${projectName}-${appVersion}.jar"
        null
    }

    quilt { container ->
        container.jarLocation = "build/libs/${projectName}-${appVersion}.jar"
        null
    }
}
