plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Development fixtures must remain available to loader runs, but not to any
// published loader variant (including Maven sources and Javadoc).
def developmentPackagePaths = [
        'net/conczin/mca/neoforge/gametest/',
        'net/conczin/mca/gametest/',
        'net/conczin/mca/benchmark/'
]
def developmentResourcePaths = [
        'data/mca/structure/ported_1_21_1/',
        'data/mca/gametest/',
        'data/mca/structure/gametest/',
        'data/mca_ab/'
]
def developmentPackageGlobs = developmentPackagePaths.collect { it + '**' }
def developmentResourceGlobs = developmentResourcePaths.collect { it + '**' }

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    // Exclude inputs, not generated HTML alone: Javadoc search indexes must
    // not advertise the excluded classes or packages either.
    exclude developmentPackageGlobs
    exclude '**/*GameTests*.java'
    exclude 'net/conczin/mca/mixin/MixinGameTestInfo.java'
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    exclude developmentPackageGlobs
    exclude developmentResourceGlobs
    exclude '**/*GameTests*.java'
    exclude 'net/conczin/mca/mixin/MixinGameTestInfo.java'
    filesMatching('mca.mixins.json') {
        filter { String line -> line.replace('"MixinGameTestInfo",', '') }
    }
}

tasks.named('jar', Jar) {
    // Runtime GameTests still use the unmodified classes/resources in build/.
    // Only the publishable archives drop the development classes and resources.
    exclude developmentPackageGlobs
    exclude developmentResourceGlobs
    exclude '**/*GameTests*.class'
    exclude 'net/conczin/mca/mixin/MixinGameTestInfo.class'
    exclude 'net/conczin/mca/mixin/MixinGameTestInfo$*.class'
    filesMatching('mca.mixins.json') {
        filter { String line -> line.replace('"MixinGameTestInfo",', '') }
    }
}

// The chunk-ticket recovery probe is needed for development GameTests, but
// neither loader's distribution should register or ship its Mixin class.
def distributionJarArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
def sourcesJarArchive = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def javadocJarArchive = tasks.named('javadocJar', Jar).flatMap { it.archiveFile }
tasks.register('verifyProductionMixinIsolation') {
    dependsOn tasks.named('jar')
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
    doLast {
        def assertNoDevelopmentEntries = { java.util.zip.ZipFile zip, File file ->
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.isDirectory()) continue
                def path = entry.name
                def className = path.substring(path.lastIndexOf('/') + 1)
                if (developmentPackagePaths.any { path.startsWith(it) }
                        || developmentResourcePaths.any { path.startsWith(it) }
                        || className ==~ /[^\/]*GameTests[^\/]*\.(?:class|java|html)/
                        || path ==~ /net\/conczin\/mca\/mixin\/MixinGameTestInfo(?:\$[^\/]+|\.[^\/]+)?\.(?:class|java|html)/) {
                    throw new GradleException("Development-only entry ${path} is packaged in ${file}")
                }
            }
        }
        def distribution = distributionJarArchive.get().asFile
        def archive = new java.util.zip.ZipFile(distribution)
        try {
            if (archive.getEntry('net/conczin/mca/mixin/MixinGameTestInfo.class') != null) {
                throw new GradleException("GameTest-only Mixin class is packaged in ${distribution}")
            }
            def config = archive.getEntry('mca.mixins.json')
            if (config == null) {
                throw new GradleException("Main Mixin config is missing from ${distribution}")
            }
            def content = archive.getInputStream(config).getText('UTF-8')
            if (content.contains('"MixinGameTestInfo"')) {
                throw new GradleException("GameTest-only Mixin is registered in ${distribution}")
            }
            if (!content.contains('"MixinMoveToTargetSink"')) {
                throw new GradleException("Production navigation Mixin disappeared from ${distribution}")
            }
            assertNoDevelopmentEntries(archive, distribution)
        } finally {
            archive.close()
        }

        def sources = sourcesJarArchive.get().asFile
        def sourcesArchive = new java.util.zip.ZipFile(sources)
        try {
            if (sourcesArchive.getEntry('net/conczin/mca/mixin/MixinGameTestInfo.java') != null) {
                throw new GradleException("GameTest-only Mixin source is packaged in ${sources}")
            }
            def config = sourcesArchive.getEntry('mca.mixins.json')
            if (config == null || sourcesArchive.getInputStream(config).getText('UTF-8').contains('"MixinGameTestInfo"')) {
                throw new GradleException("Sources Mixin config includes GameTest probe or is missing from ${sources}")
            }
            assertNoDevelopmentEntries(sourcesArchive, sources)
        } finally {
            sourcesArchive.close()
        }

        def javadoc = javadocJarArchive.get().asFile
        def javadocArchive = new java.util.zip.ZipFile(javadoc)
        try {
            assertNoDevelopmentEntries(javadocArchive, javadoc)
            // The JDK 25 indexes contain package names (p/l) and class names
            // (l/c). Check exact package boundaries and type-name fields rather
            // than incidental mentions in documentation or member signatures.
            def developmentPackages = developmentPackagePaths.collect { it.substring(0, it.length() - 1).replace('/', '.') }
            def isDevelopmentPackage = { String name ->
                developmentPackages.any { name == it || name.startsWith(it + '.') }
            }
            def isDevelopmentType = { String name ->
                name ==~ /[\w$]*GameTests[\w$]*(?:\.[\w$]+)*/
                        || name ==~ /MixinGameTestInfo(?:\.[\w$]+)*/
            }
            ['package-search-index.js', 'type-search-index.js', 'member-search-index.js'].each { indexName ->
                def entry = javadocArchive.getEntry(indexName)
                if (entry == null) {
                    throw new GradleException("Missing ${indexName} in ${javadoc}")
                }
                def text = javadocArchive.getInputStream(entry).getText('UTF-8')
                def start = text.indexOf('[')
                def end = text.lastIndexOf(']')
                if (start < 0 || end < start) {
                    throw new GradleException("Invalid ${indexName} in ${javadoc}")
                }
                def items = new groovy.json.JsonSlurper().parseText(text.substring(start, end + 1))
                if (items.any { item ->
                    if (indexName == 'package-search-index.js') return isDevelopmentPackage(item.l ?: '')
                    isDevelopmentPackage(item.p ?: '') || isDevelopmentType((indexName == 'type-search-index.js' ? item.l : item.c) ?: '')
                }) {
                    throw new GradleException("Development-only package or type in ${indexName} of ${javadoc}")
                }
            }
        } finally {
            javadocArchive.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionMixinIsolation')
}
