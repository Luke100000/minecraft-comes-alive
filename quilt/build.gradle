plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

def projectGroup = providers.gradleProperty('groupId').get()
def projectVersion = version.toString()
def publicationArtifactId = providers.gradleProperty('artifactId').get()
def publicationGroupId = providers.gradleProperty('groupId').get()
def quiltLoaderVersion = providers.gradleProperty('quilt_loader_version').get()
def quiltedFabricApiVersion = providers.gradleProperty('quilted_fabric_api_version').get()
def architecturyVersion = providers.gradleProperty('architectury_version').get()

repositories {
    maven { url = "https://maven.quiltmc.org/repository/release/" }
}

architectury {
    platformSetupLoomIde()
    loader("quilt")
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

def shadowCommonConfiguration = configurations.named('shadowCommon')
def shadowJarTask = tasks.named('shadowJar')

dependencies {
    modImplementation "org.quiltmc:quilt-loader:${quiltLoaderVersion}"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${quiltedFabricApiVersion}"
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    modImplementation("dev.architectury:architectury-fabric:${architecturyVersion}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon project(path: ':common', configuration: 'transformProductionQuilt')
}

tasks.named('processResources') {
    inputs.property 'group', projectGroup
    inputs.property 'version', projectVersion

    // Quilt's runtime resource directory must include the shared descriptors
    // referenced by quilt.mod.json.
    from project(':common').sourceSets.main.resources

    filesMatching('quilt.mod.json') {
        expand group: projectGroup, version: projectVersion
    }

    from 'LICENSE'
}

tasks.named('shadowJar') {
    configurations = [shadowCommonConfiguration.get()]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    input.set(shadowJarTask.flatMap { it.archiveFile })
}

