plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()
def projectVersion = version.toString()
def publicationArtifactId = providers.gradleProperty('artifactId').get()
def publicationGroupId = providers.gradleProperty('groupId').get()
def loaderVersion = providers.gradleProperty('loader_version').get()
def fabricVersion = providers.gradleProperty('fabric_version').get()
def architecturyVersion = providers.gradleProperty('architectury_version').get()

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        client {
            programArgs "--username", devUsername
        }

        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("build/datagen/generated")}"
            vmArg "-Dfabric-api.datagen.modid=mca"

            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

def shadowCommonConfiguration = configurations.named('shadowCommon')
def shadowJarTask = tasks.named('shadowJar')

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
    modImplementation "dev.architectury:architectury-fabric:${architecturyVersion}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon project(path: ':common', configuration: 'transformProductionFabric')
}

tasks.named('processResources') {
    inputs.property 'version', projectVersion

    filesMatching('fabric.mod.json') {
        expand version: projectVersion
    }

    from 'LICENSE'
}

tasks.named('shadowJar') {
    configurations = [shadowCommonConfiguration.get()]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    input.set(shadowJarTask.flatMap { it.archiveFile })
}

