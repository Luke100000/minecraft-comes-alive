plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    //modLocalRuntime "maven.modrinth:iris:${iris_version}"
    modLocalRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    modLocalRuntime "maven.modrinth:packet-fixer:${packetfixer_version}"
    modLocalRuntime "maven.modrinth:entity-model-features:${emf_version}"
    modLocalRuntime "maven.modrinth:entitytexturefeatures:${etf_version}"
    modLocalRuntime "maven.modrinth:h1E7sQNL:${cpm_fabric_version}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            programArgs("--username", devUsername)
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

fabricApi {
    configureDataGeneration {
        addToResources = false
        client = true
        createRunConfiguration = true
        createSourceSet = true
        modId = "${mod_id}-datagen"
        outputDirectory = rootProject.project(':common').file('src/generated/resources')
        strictValidation = true
    }
}
