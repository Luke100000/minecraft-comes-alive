plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    runtimeOnly "maven.modrinth:sodium:${sodium_fabric_version}"
    runtimeOnly "maven.modrinth:iris:${iris_fabric_version}"
    runtimeOnly "maven.modrinth:ferrite-core:${ferritecore_fabric_version}"
    runtimeOnly "maven.modrinth:immediatelyfast:${immediatelyfast_fabric_version}"
    runtimeOnly "maven.modrinth:packet-fixer:${packetfixer_fabric_version}"
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

fabricApi {
    configureDataGeneration {
        addToResources = false
        client = true
        outputDirectory = file("src/generated/resources")
    }
}
