plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()

loom {
    runs {
        client {
            programArgs "--username", devUsername
        }

        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("build/datagen/generated")}"
            vmArg "-Dfabric-api.datagen.modid=mca"

            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon project(path: ':common', configuration: 'transformProductionFabric')

}

processResources {
    def projectVersion = project.version.toString()
    inputs.property 'version', projectVersion

    filesMatching('fabric.mod.json') {
        expand version: projectVersion
    }

    from 'LICENSE'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

