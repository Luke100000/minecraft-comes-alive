plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()

loom {
    accessWidenerPath = project(':common').file('src/main/resources/mca.classtweaker')

    mods {
        mca {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            programArgs '--username', devUsername
        }
        server {
            server()
        }
        datagen {
            inherit server
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('build/datagen/generated')}"
            vmArg '-Dfabric-api.datagen.modid=mca'
            runDir 'build/datagen'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/main/generated'
}
