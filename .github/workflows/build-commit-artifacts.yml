# Builds every pushed commit and uploads the Fabric and NeoForge jars as artifacts.
name: build-commit-artifacts

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract current branch name
        id: ref
        shell: bash
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> "$GITHUB_OUTPUT"

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build Fabric and NeoForge jars
        run: ./gradlew :fabric:build :neoforge:build --console=plain

      - name: Upload Fabric jars
        uses: actions/upload-artifact@v7
        with:
          name: mca-fabric-${{ steps.ref.outputs.branch }}-${{ github.sha }}
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge jars
        uses: actions/upload-artifact@v7
        with:
          name: mca-neoforge-${{ steps.ref.outputs.branch }}-${{ github.sha }}
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
