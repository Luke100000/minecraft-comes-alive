# Builds every pushed commit and uploads the universal jar as an artifact.
name: build-commit-artifacts

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: 1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fixes 128 by fetching all tags and history for buildscripts

      - name: Extract Minecraft version
        id: versions
        shell: bash
        run: echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Fixes potential 128 safe directory permissions errors
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Artifacts with Gradle
        run: ./gradlew build --console=plain --non-interactive

      - name: Upload Universal Jars
        uses: actions/upload-artifact@v7
        with:
          name: mca-universal-${{ steps.versions.outputs.minecraft_version }}
          path: |
            build/libs/*-@(universal).jar
          if-no-files-found: error