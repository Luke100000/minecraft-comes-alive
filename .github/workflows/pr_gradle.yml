name: Java Pull Request CI with Gradle

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build with Gradle - NeoForge
        run: ./gradlew :neoforge:build --console=plain --non-interactive
      - name: Build with Gradle - Fabric
        run: ./gradlew :fabric:build --console=plain --non-interactive
