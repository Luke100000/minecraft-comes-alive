name: Java Release with Gradle

on:
  push:
    tags:
      - '*\+*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      minecraft_version: ${{ steps.validate.outputs.minecraft_version }}
    steps:
      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'

          if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
            echo "::notice title=Invalid release tag::Skipping release. Expected '<mod_version>+<minecraft_version>', for example '1.1.1+1.2.3'."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag%%+*}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${tag#*+}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      MODRINTH_ID: "1W98a849"
      CURSEFORGE_ID: "535291"
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build with Gradle
        run: ./gradlew build --configuration-cache --console=plain
      - name: "Upload Fabric"
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[Fabric ${{needs.validate-tag.outputs.minecraft_version}}] MCAR - ${{needs.validate-tag.outputs.version}}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/mca-fabric-${{needs.validate-tag.outputs.tag}}.jar"
          loaders: |
            fabric
          game-versions: |
            ${{needs.validate-tag.outputs.minecraft_version}}
          java: |
            Java 25

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[NeoForge ${{needs.validate-tag.outputs.minecraft_version}}] MCAR - ${{needs.validate-tag.outputs.version}}"
          changelog-file: changelog.md
          version-type: release
          files: "neoforge/build/libs/mca-neoforge-${{needs.validate-tag.outputs.tag}}.jar"
          loaders: |
            neoforge
          game-versions: |
            ${{needs.validate-tag.outputs.minecraft_version}}
          java: |
            Java 25

          fail-mode: skip
