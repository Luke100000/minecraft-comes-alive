name: Java Release with Gradle

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_ID: "1W98a849"
      CURSEFORGE_ID: "535291"
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      NO_COLOR: 1
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Artifacts with Gradle
        run: ./gradlew build --console=plain --non-interactive
      - name: Publish to Maven
        run: ./gradlew publish --console=plain --non-interactive
      - name: Get tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag%%+*}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${tag#*+}" >> "$GITHUB_OUTPUT"
      - name: "Upload Fabric"
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[Fabric ${{steps.tag.outputs.minecraft_version}}] MCAR - ${{steps.tag.outputs.version}}"
          changelog-file: changelog.md
          version-type: ${{ contains(steps.tag.outputs.version, 'beta') && 'beta' || contains(steps.tag.outputs.version, 'alpha') && 'alpha' || 'release' }}
          files: "fabric/build/libs/mca-fabric-${{steps.tag.outputs.tag}}.jar"
          loaders: |
            fabric
          game-versions: |
            ${{steps.tag.outputs.minecraft_version}}
          java: |
            Java 21

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[NeoForge ${{steps.tag.outputs.minecraft_version}}] MCAR - ${{steps.tag.outputs.version}}"
          changelog-file: changelog.md
          version-type: ${{ contains(steps.tag.outputs.version, 'beta') && 'beta' || contains(steps.tag.outputs.version, 'alpha') && 'alpha' || 'release' }}
          files: "neoforge/build/libs/mca-neoforge-${{steps.tag.outputs.tag}}.jar"
          loaders: |
            neoforge
          game-versions: |
            ${{steps.tag.outputs.minecraft_version}}
          java: |
            Java 21

          fail-mode: skip
