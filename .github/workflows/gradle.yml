name: Java Release with Gradle

on:
  push:
    tags:
      - '*\+*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      minecraft_version: ${{ steps.validate.outputs.minecraft_version }}
    steps:
      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'

          if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
            echo "::notice title=Invalid release tag::Skipping release. Expected '<mod_version>+<minecraft_version>', for example '7.7.1-beta.4+1.20.1'."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag%%+*}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${tag#*+}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      NO_COLOR: 1
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Artifacts with Gradle
        run: ./gradlew build --build-cache --configuration-cache --console=plain --non-interactive
      - name: Merge Universal Jar
        run: ./gradlew mergeJars --no-configuration-cache --console=plain --non-interactive
      - name: Publish to Maven
        run: ./gradlew publish --build-cache --configuration-cache --console=plain --non-interactive
      - name: "Upload to Distributors"
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: 1W98a849
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: 535291
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          environment: client | server

          name: "[Universal ${{needs.validate-tag.outputs.minecraft_version}}] MCA Reborn - ${{needs.validate-tag.outputs.version}}"
          changelog-file: changelog.md
          version-type: ${{ contains(needs.validate-tag.outputs.version, 'beta') && 'beta' || contains(needs.validate-tag.outputs.version, 'alpha') && 'alpha' || 'release' }}
          files: build/libs/*-universal.jar
          loaders: |
            fabric
            forge
          game-versions: |
            ${{needs.validate-tag.outputs.minecraft_version}}
          java: |
            Java 17
          dependencies: |
            fabric-api | recommends | *

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: skip
