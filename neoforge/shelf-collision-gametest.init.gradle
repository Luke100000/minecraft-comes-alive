// Keep collision repros away from a possibly active run-gametest world.
gradle.beforeProject { project ->
    // Opt-in outputs plus a separate --project-cache-dir keep concurrent task
    // configurations from deleting one another's previous compilation outputs.
    if (project.providers.gradleProperty('bridgeIsolatedBuild').isPresent()
            && project.path in [':common', ':neoforge', ':fabric']) {
        project.layout.buildDirectory.set(project.rootProject.file('.superpowers/bridge-navigation/build/' + project.name))
        project.plugins.withId('java') {
            project.sourceSets.configureEach { sourceSet ->
                sourceSet.java.destinationDirectory.set(project.layout.buildDirectory.dir('classes/java/' + sourceSet.name))
                sourceSet.output.resourcesDir = project.layout.buildDirectory.dir('resources/' + sourceSet.name).get().asFile
            }
            project.tasks.withType(JavaCompile).configureEach { compile ->
                compile.destinationDirectory.set(project.layout.buildDirectory.dir('classes/java/'
                        + (compile.name == 'compileTestJava' ? 'test' : 'main')))
            }
        }
    }
    if (project.path == ':neoforge') {
        project.afterEvaluate {
            project.neoForge.runs.gameTestServer.gameDirectory = project.file('run-gametest-shelf-collision/')
        }
    }
}
