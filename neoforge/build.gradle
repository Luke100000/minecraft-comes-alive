import net.neoforged.minecraftdependencies.MinecraftDistribution
import net.neoforged.minecraftdependencies.OperatingSystem as NeoForgeOperatingSystem

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    implementation(jarJar(
            "io.github.llamalad7:mixinextras-neoforge:${mixin_extras_version}"
    )) {
        version {
            strictly '[0.5.3,0.6)'
            prefer mixin_extras_version
        }
    }
    runtimeOnly "maven.modrinth:sodium:${sodium_neoforge_version}"
    // No compatible 26.3 NeoForge builds are available for these dev-only helpers.
    //runtimeOnly "maven.modrinth:jei:${jei_neoforge_version}"
    //runtimeOnly "maven.modrinth:iris:${iris_neoforge_version}"
    //runtimeOnly "maven.modrinth:ferrite-core:${ferritecore_neoforge_version}"
    //runtimeOnly "maven.modrinth:immediatelyfast:${immediatelyfast_neoforge_version}"
    // PacketFixer 3.3.6 crashes on NeoForge 26.3's Mixin API during startup
    // (missing IMixinConfigPlugin#getRefMapperConfig), so keep it out of dev/runtime runs.
    //runtimeOnly "maven.modrinth:packet-fixer:${packetfixer_neoforge_version}"
}

neoForge {
    version = neoforge_version

    accessTransformers.from(project(':common').tasks.named('generateAccessTransformer'))

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            jvmArgument '--illegal-native-access=allow'
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.project(':common').file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        gameTestServer {
            type.set('gameTestServer')
            gameDirectory = file('run-gametest/')
            ideName = "NeoForge GameTest Server (${project.path})"
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},minecraft")
        }
        benchmarkGameTestServer {
            type.set('gameTestServer')
            gameDirectory = file('run-abbenchmark/')
            ideName = "NeoForge A/B GameTest Server (${project.path})"
            systemProperty('neoforge.enabledGameTestNamespaces', 'mca_ab')
            systemProperty('mca.pathABBenchmark', 'true')
            // Exclude development-only StackWalker diagnostics from comparative CPU samples.
            systemProperty('mca.pathDebug.benchmarkWithoutDiagnostics', 'true')
        }
        benchmarkOpenGameTestServer {
            type.set('gameTestServer')
            gameDirectory = file('run-abopen/')
            ideName = "NeoForge Open-Only Path Benchmark (${project.path})"
            systemProperty('neoforge.enabledGameTestNamespaces', 'mca_ab')
            systemProperty('mca.pathABBenchmark', 'true')
            systemProperty('mca.pathABOpenOnly', 'true')
            // Isolate released navigation costs; regular development runs still retain all path debug logs.
            systemProperty('mca.pathDebug.benchmarkWithoutDiagnostics', 'true')
        }
        searchBudgetGameTestServer {
            type.set('gameTestServer')
            def horizon = providers.gradleProperty('mcaSearchHorizon').getOrElse('160')
            def nodeCap = providers.gradleProperty('mcaSearchNodeCap').getOrElse('0')
            def runLabel = providers.gradleProperty('mcaSearchRun').getOrElse('first')
            if (!(horizon ==~ /\d+/) || !(nodeCap ==~ /\d+/) || !(runLabel ==~ /[a-z0-9-]+/)) {
                throw new GradleException('Search experiment settings must be numeric with a simple run label')
            }
            // Each alternative gets its own disposable world; never use a player's save.
            gameDirectory = file("run-searchbudget-${horizon}-${nodeCap}-${runLabel}/")
            systemProperty('neoforge.enabledGameTestNamespaces', 'mca_ab')
            systemProperty('mca.pathSearchBenchmark', 'true')
            systemProperty('mca.pathSearchHorizon', horizon)
            systemProperty('mca.pathSearchNodeCap', nodeCap)
            // Work-count experiment, not a release CPU comparison: keep diagnostics enabled.
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Implement mcgradleconventions loader attribute.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

def neoForgeOperatingSystem = {
    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (osName.contains('win')) {
        return NeoForgeOperatingSystem.WINDOWS
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return NeoForgeOperatingSystem.MACOSX
    }
    return NeoForgeOperatingSystem.LINUX
}()

configurations.matching { it.name == 'neoFormRuntimeDependenciesRuntimeClasspath' }.configureEach {
    attributes {
        attribute(NeoForgeOperatingSystem.ATTRIBUTE, objects.named(NeoForgeOperatingSystem, neoForgeOperatingSystem))
    }
}

sourceSets.configureEach {
    configurations.named(it.compileClasspathConfigurationName) {
        attributes {
            attribute(MinecraftDistribution.ATTRIBUTE, objects.named(MinecraftDistribution, MinecraftDistribution.CLIENT))
        }
    }
    configurations.named(it.runtimeClasspathConfigurationName) {
        attributes {
            attribute(MinecraftDistribution.ATTRIBUTE, objects.named(MinecraftDistribution, MinecraftDistribution.CLIENT))
            attribute(NeoForgeOperatingSystem.ATTRIBUTE, objects.named(NeoForgeOperatingSystem, neoForgeOperatingSystem))
        }
    }
}

// ModDev applies the generated transformer in development, but a distributed
// NeoForge jar must also contain it at the loader's conventional resource path.
tasks.named('processResources', ProcessResources) {
    dependsOn(project(':common').tasks.named('generateAccessTransformer'))
    from(project(':common').layout.buildDirectory.file('generated/accesstransformer.cfg')) {
        into 'META-INF'
    }
}

tasks.named('jar') {
    exclude '**/*GameTests*.class'
    exclude 'net/conczin/mca/neoforge/gametest/**'
    exclude 'data/mca/structure/ported_1_21_1/**'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
