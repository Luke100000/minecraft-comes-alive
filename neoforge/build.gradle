plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    runtimeOnly "maven.modrinth:sodium:${sodium_neoforge_version}"
    runtimeOnly "maven.modrinth:iris:${iris_neoforge_version}"
    runtimeOnly "maven.modrinth:ferrite-core:${ferritecore_neoforge_version}"
    runtimeOnly "maven.modrinth:immediatelyfast:${immediatelyfast_neoforge_version}"
    runtimeOnly "maven.modrinth:packet-fixer:${packetfixer_neoforge_version}"
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
