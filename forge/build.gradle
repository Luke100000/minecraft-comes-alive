plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

def projectVersion = version.toString()
def publicationArtifactId = providers.gradleProperty('artifactId').get()
def publicationGroupId = providers.gradleProperty('groupId').get()
def forgeVersion = providers.gradleProperty('forge_version').get()
def architecturyVersion = providers.gradleProperty('architectury_version').get()
def updateJsonUrl = providers.gradleProperty('update_json_url').get()

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "mca.mixin.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

def shadowCommonConfiguration = configurations.named('shadowCommon')
def shadowRuntimeElementsConfiguration = configurations.named('shadowRuntimeElements')
def shadowJarTask = tasks.named('shadowJar')
def commonMainSources = project(':common').sourceSets.main.allSource

dependencies {
    forge "net.minecraftforge:forge:${forgeVersion}"
    modApi "dev.architectury:architectury-forge:${architecturyVersion}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon project(path: ':common', configuration: 'transformProductionForge')
}

tasks.named('processResources') {
    inputs.property 'version', projectVersion
    inputs.property 'update_json_url', updateJsonUrl

    filesMatching('META-INF/mods.toml') {
        expand version: projectVersion, update_json_url: updateJsonUrl
    }
}

tasks.named('shadowJar') {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [shadowCommonConfiguration.get()]
    archiveClassifier = "dev-shadow"
}

tasks.named('remapJar') {
    input.set(shadowJarTask.flatMap { it.archiveFile })
    dependsOn shadowJarTask
}

tasks.named('sourcesJar') {
    from commonMainSources
}

components.java {
    addVariantsFromConfiguration(shadowRuntimeElementsConfiguration.get()) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = publicationArtifactId
            groupId = publicationGroupId
            version = projectVersion + "+forge"
            from components.java
        }
    }
}
