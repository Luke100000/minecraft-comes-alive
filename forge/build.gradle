plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

dependencies {
    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")) {
        version {
            strictly '[0.5.4,0.6)'
            prefer mixin_extras_version
        }
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'mca.refmap.json'
    config 'mca.mixin.json'
    config 'mca.journeymap.mixin.json'
}

legacyForge {
    version = forge_version
    validateAccessTransformers = true
    accessTransformers.from(project(':common').tasks.named('generateAccessTransformer'))

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client { client() }
        data { data() }
        server { server() }
    }

    mods {
        mca {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn(project(':common').tasks.named('generateAccessTransformer'))
    from(project(':common').layout.buildDirectory.file('generated/accesstransformer.cfg')) {
        into 'META-INF'
    }
    filesMatching('mca.mixin.json') {
        filter { line ->
            line.contains('"minVersion"')
                    ? line + System.lineSeparator() + '  "refmap": "mca.refmap.json",'
                    : line
        }
    }
}

jar {
    manifest {
        attributes 'MixinConfigs': 'mca.mixin.json'
    }
}

tasks.named('javadoc') {
    enabled = false
}

tasks.named('javadocJar') {
    enabled = false
}
